.tk-filter{display:flex;gap:8px;flex-wrap:wrap}
.tk-filter button{font-family:'Nohemi',Helvetica,Arial,sans-serif;font-size:12px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;padding:11px 22px;border-radius:4px;border:1px solid rgba(0,24,72,0.18);background:transparent;color:#001848;cursor:pointer;transition:background 180ms cubic-bezier(0.16,1,0.3,1),color 180ms cubic-bezier(0.16,1,0.3,1),border-color 180ms cubic-bezier(0.16,1,0.3,1)}
.tk-filter button:hover{background:rgba(0,24,72,0.06)}
.tk-filter button[data-active="true"]{background:#001848;color:#fff;border-color:#001848}
.tk-grid{display:grid;gap:12px}
.tk-grid-item{position:relative;border-radius:6px;overflow:hidden;cursor:pointer;background:#001848}
.tk-grid-item img,.tk-grid-item video{width:100%;height:100%;object-fit:cover;display:block;transition:transform 380ms cubic-bezier(0.16,1,0.3,1)}
.tk-grid-item:hover img,.tk-grid-item:hover video{transform:scale(1.05)}
.tk-grid-item .tk-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,12,36,0.72) 0%,transparent 50%);opacity:0;transition:opacity 220ms cubic-bezier(0.16,1,0.3,1);display:flex;align-items:flex-end;padding:16px}
.tk-grid-item:hover .tk-overlay{opacity:1}
.tk-overlay span{font-family:'Nohemi',Helvetica,Arial,sans-serif;font-size:12px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:#ebb130}
.tk-play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:56px;height:56px;border-radius:999px;background:rgba(0,18,51,0.62);backdrop-filter:blur(10px);display:grid;place-items:center;pointer-events:none}
.tk-lightbox{position:fixed;inset:0;z-index:500;background:rgba(0,6,18,0.92);backdrop-filter:blur(16px);display:flex;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
.tk-lightbox img,.tk-lightbox video{max-width:92vw;max-height:88vh;border-radius:6px;object-fit:contain}
.tk-lb-close{position:absolute;top:20px;right:20px;width:44px;height:44px;border-radius:999px;border:1px solid rgba(255,255,255,0.3);background:rgba(0,18,51,0.6);color:#fff;display:grid;place-items:center;cursor:pointer}
.tk-lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:999px;border:1px solid rgba(255,255,255,0.25);background:rgba(0,18,51,0.5);color:#fff;display:grid;place-items:center;cursor:pointer;transition:background 180ms}
.tk-lb-nav:hover{background:rgba(198,138,26,0.4)}

<div style="position:relative;max-width:1200px;margin:0 auto;padding:clamp(140px,14vw,170px) clamp(18px,4vw,40px) clamp(48px,6vw,80px)">
<x-import component-from-global-scope="SajjDesignSystem_a4cf4b.Eyebrow" tone="goldOnDeep" hint-size="120px,14px">Gallery</x-import>
<h1 style="font-family:'Nohemi',Helvetica,Arial,sans-serif;font-size:clamp(32px,5.4vw,60px);font-weight:700;line-height:1.06;letter-spacing:-0.01em;color:#fff;margin:20px 0 24px;max-width:16ch">Moments from the field</h1>
<x-import component-from-global-scope="SajjDesignSystem_a4cf4b.GoldRule" width="150px" hint-size="150px,2px"></x-import>

<!-- Filters -->
<section style="padding:clamp(40px,6vw,64px) clamp(18px,4vw,40px) 0">
<div style="max-width:1200px;margin:0 auto">
<div class="tk-filter">
<sc-for list="{{ categories }}" as="cat" hint-placeholder-count="6">
<button data-active="{{ cat.active }}" onClick="{{ cat.onClick }}">{{ cat.label }}</button>
</sc-for>
</div>
</div>
</section>

<!-- Gallery grid -->
<section style="padding:clamp(28px,4vw,40px) clamp(18px,4vw,40px) clamp(56px,8vw,96px)">
<div style="max-width:1200px;margin:0 auto">
<div class="tk-grid" style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr));grid-auto-rows:260px">
<sc-for list="{{ filtered }}" as="item" hint-placeholder-count="12">
<div class="tk-grid-item" onClick="{{ item.open }}" style="{{ item.span }}">
<sc-if value="{{ item.isVideo }}" hint-placeholder-val="{{ false }}">
<video src="{{ item.src }}" muted loop playsinline preload="metadata" style="width:100%;height:100%;object-fit:cover"></video>
<div class="tk-play"><svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><polygon points="6,3 20,12 6,21"></polygon></svg></div>
</sc-if>
<sc-if value="{{ item.isPhoto }}" hint-placeholder-val="{{ true }}">
<img src="{{ item.src }}" alt="{{ item.alt }}" style="width:100%;height:100%;object-fit:cover;display:block">
</sc-if>
<div class="tk-overlay"><span>{{ item.cat }}</span></div>
</div>
</sc-for>
</div>
<sc-if value="{{ hasMore }}" hint-placeholder-val="{{ false }}">
<div style="text-align:center;margin-top:clamp(36px,5vw,52px)">
<button onClick="{{ loadMore }}" style="font-family:'Nohemi',Helvetica,Arial,sans-serif;font-size:12px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#001848;background:transparent;border:1px solid rgba(0,24,72,0.24);padding:16px 36px;border-radius:4px;cursor:pointer;transition:background 180ms cubic-bezier(0.16,1,0.3,1)" style-hover="background:rgba(0,24,72,0.06)">Load more</button>
</div>
</sc-if>
</div>
</section>

<!-- Lightbox -->
<sc-if value="{{ lightboxOpen }}" hint-placeholder-val="{{ false }}">
<div class="tk-lightbox" onClick="{{ closeLightbox }}">
<button class="tk-lb-close" onClick="{{ closeLightbox }}" aria-label="Close">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"></path></svg>
</button>
<button class="tk-lb-nav" style="left:16px" onClick="{{ prevItem }}" aria-label="Previous">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 4l-8 8 8 8"></path></svg>

<sc-if value="{{ lbIsVideo }}" hint-placeholder-val="{{ false }}">

<button class="tk-lb-nav" style="right:16px" onClick="{{ nextItem }}" aria-label="Next">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 4l8 8-8 8"></path></svg>
</button>
</div>
</sc-if>

<dc-import name="SiteFooter" hint-size="100%,0px"></dc-import>
</div>

<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { filter: "All", lightbox: -1, shown: 12 };

  componentDidMount() {
    const params = new URLSearchParams(window.location.search);
    const f = params.get("filter");
    if (f && this.CATS.includes(f)) {
      this.setState({ filter: f });
    }
    this._onKey = (e) => {
      if (this.state.lightbox < 0) return;
      if (e.key === "Escape") this.setState({ lightbox: -1 });
      if (e.key === "ArrowLeft") {
        const len = this.getFiltered().length;
        this.setState(s => ({ lightbox: (s.lightbox - 1 + len) % len }));
      }
      if (e.key === "ArrowRight") {
        const len = this.getFiltered().length;
        this.setState(s => ({ lightbox: (s.lightbox + 1) % len }));
      }
    };
    document.addEventListener("keydown", this._onKey);
  }

  getFiltered() {
    const f = this.state.filter;
    if (f === "All") return this.ITEMS;
    if (f === "Videos") return this.ITEMS.filter(i => i.type === "video");
    return this.ITEMS.filter(i => i.cat === f);
  }

  renderVals() {
    const filtered = this.getFiltered();
    const shown = filtered.slice(0, this.state.shown);
    const lbIdx = this.state.lightbox;
    const lbItem = lbIdx >= 0 ? filtered[lbIdx] : null;

    return {
      categories: this.CATS.map(c => ({
        label: c,
        active: c === this.state.filter ? "true" : "false",
        onClick: (e) => { e.stopPropagation(); this.setState({ filter: c, shown: 12 }); }
      })),
      filtered: shown.map((item, i) => ({
        src: item.src,
        alt: item.alt || "",
        cat: item.cat,
        isVideo: item.type === "video",
        isPhoto: item.type !== "video",
        span: item.span && window.innerWidth >= 700 ? "grid-column:span 2" : "",
        open: () => this.setState({ lightbox: i })
      })),
      hasMore: shown.length < filtered.length,
      loadMore: () => this.setState(s => ({ shown: s.shown + 12 })),
      lightboxOpen: lbIdx >= 0,
      lbSrc: lbItem ? lbItem.src : "",
      lbAlt: lbItem ? (lbItem.alt || "") : "",
      lbIsVideo: lbItem ? lbItem.type === "video" : false,
      lbIsPhoto: lbItem ? lbItem.type !== "video" : true,
      closeLightbox: () => this.setState({ lightbox: -1 }),
      stopProp: (e) => e.stopPropagation(),
      prevItem: (e) => {
        e.stopPropagation();
        const len = this.getFiltered().length;
        this.setState(s => ({ lightbox: (s.lightbox - 1 + len) % len }));
      },
      nextItem: (e) => {
        e.stopPropagation();
        const len = this.getFiltered().length;
        this.setState(s => ({ lightbox: (s.lightbox + 1) % len }));
      }
    };
  }

  componentWillUnmount() {
    if (this._onKey) document.removeEventListener("keydown", this._onKey);
  }
}
